name: FIE team ranking update
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'olfencing*.html'
      - 'css/fencing.css'
      - 'js/fencing-quota.js'
      - 'tools/update_fie_rankings.py'
      - '.github/workflows/fie-ranking-update.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fie-team-rankings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/update_fie_rankings.py
      - name: Save complete official rankings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fie-team-ranking.json data/fie-team-history
          if ! git diff --cached --quiet; then
            git commit -m 'Update FIE senior team ranking snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy latest rankings and pages
        id: deployment
        uses: actions/deploy-pages@v4
