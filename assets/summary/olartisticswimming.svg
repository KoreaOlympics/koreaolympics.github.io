<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 726" width="640" height="726" role="img" aria-label="아티스틱 스위밍 한눈에 보기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>아티스틱 스위밍 한눈에 보기</title><rect x="1" y="1" width="638" height="724" rx="8" fill="#fff" stroke="#c8ccd1"/>
