<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 595" width="640" height="595" role="img" aria-label="수영 한눈에 보기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>수영 한눈에 보기</title><rect x="1" y="1" width="638" height="593" rx="8" fill="#fff" stroke="#c8ccd1"/>
<text x="20" y="38" font-size="22" fill="#202122" font-weight="bold" text-anchor="start">수영 한눈에 보기</text>
<text x="620" y="38" font-size="18" fill="#3265a8" font-weight="bold" text-anchor="end">41개 세부종목</text>
<text x="620" y="58" font-size="12" fill="#54595d" font-weight="normal" text-anchor="end">LA28 출전 규모</text>
<rect x="20" y="63" width="4" height="16" fill="#3265a8"/>
<text x="32" y="76" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">경기 방식</text>
<rect x="20" y="90" width="185" height="34" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="113" y="112" font-size="13" fill="#202122" font-weight="normal" text-anchor="middle">예선</text>
<path d="M210 101 L221 107 L210 113" fill="#3265a8"/>
<rect x="227" y="90" width="185" height="34" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="320" y="112" font-size="13" fill="#202122" font-weight="normal" text-anchor="middle">준결승 (200m 이하)</text>
<path d="M418 101 L429 107 L418 113" fill="#3265a8"/>
<rect x="435" y="90" width="185" height="34" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="527" y="112" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle">결승 8명</text>
<rect x="20" y="145" width="4" height="16" fill="#3265a8"/>
<text x="32" y="158" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">핵심 규칙</text>
<circle cx="30" cy="181" r="10" fill="#3265a8"/>
<text x="30" y="186" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="50" y="186" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">부정출발은 1회에 바로 실격이다.</text>
<circle cx="30" cy="209" r="10" fill="#3265a8"/>
<text x="30" y="214" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="50" y="214" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">영법마다 턴·터치 규정이 있고 어기면 실격이다.</text>
<circle cx="30" cy="237" r="10" fill="#3265a8"/>
<text x="30" y="242" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="50" y="242" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">LA28에는 배영·평영·접영 50m가 새로 열린다.</text>
<rect x="20" y="275" width="4" height="16" fill="#3265a8"/>
<text x="32" y="288" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">LA28 예선 구조 (위에서부터 차례로 배정)</text>
<line x1="32" y1="330" x2="32" y2="378" stroke="#3265a8" stroke-width="2"/>
<circle cx="32" cy="330" r="11" fill="#3265a8"/>
<text x="32" y="334" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<rect x="54" y="318" width="566" height="50" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="338" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">A 기준기록</text>
<rect x="528" y="324" width="84" height="22" rx="11" fill="#3265a8"/>
<text x="570" y="339" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">국가당 2명</text>
<text x="66" y="355" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">예선 기간 · 종목별</text>
<line x1="32" y1="390" x2="32" y2="438" stroke="#3265a8" stroke-width="2"/>
<circle cx="32" cy="390" r="11" fill="#3265a8"/>
<text x="32" y="394" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<rect x="54" y="378" width="566" height="50" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="398" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">B 기준기록·초청</text>
<text x="66" y="415" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">예선 기간</text>
<line x1="32" y1="450" x2="32" y2="498" stroke="#3265a8" stroke-width="2"/>
<circle cx="32" cy="450" r="11" fill="#3265a8"/>
<text x="32" y="454" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<rect x="54" y="438" width="566" height="50" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="458" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">세계선수권 계영</text>
<rect x="520" y="444" width="92" height="22" rx="11" fill="#3265a8"/>
<text x="566" y="459" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">상위 12개국</text>
<text x="66" y="475" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">2027 · 계영 직접 선발</text>
<circle cx="32" cy="510" r="11" fill="#3265a8"/>
<text x="32" y="514" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<rect x="54" y="498" width="566" height="33" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="518" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">보편성</text>
<text x="20" y="553" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">세부 인원은 본문 예선 규정을 따른다.</text>
<text x="20" y="579" font-size="11" fill="#54595d" font-weight="normal" text-anchor="start">숫자는 이 문서의 예선 규정 정리 기준이다. 세부 조건과 출처는 본문에 있다.</text>
</svg>
