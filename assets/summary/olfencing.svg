<text x="66" y="433" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">같은 기간 · 단체 미확보 국가</text>
<line x1="32" y1="468" x2="32" y2="516" stroke="#3265a8" stroke-width="2"/>
<circle cx="32" cy="468" r="11" fill="#3265a8"/>
