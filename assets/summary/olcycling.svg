<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 708" width="640" height="708" role="img" aria-label="사이클 한눈에 보기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>사이클 한눈에 보기</title><rect x="1" y="1" width="638" height="706" rx="8" fill="#fff" stroke="#c8ccd1"/>
<text x="20" y="38" font-size="22" fill="#202122" font-weight="bold" text-anchor="start">사이클 한눈에 보기</text>
