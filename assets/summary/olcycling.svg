<text x="30" y="186" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="50" y="186" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">도로는 단체 출발 레이스와 혼자 시간을 재는 독주(타임트라이얼)가 있다.</text>
