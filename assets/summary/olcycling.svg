<rect x="227" y="90" width="185" height="34" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="320" y="112" font-size="13" fill="#202122" font-weight="normal" text-anchor="middle">도로: 단판 레이스·독주</text>
