<text x="30" y="214" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="50" y="214" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">트랙 스프린트는 기록 시드 후 1대1 대결, 케이린은 페이서 퇴장 후 전력 질주다.</text>
<circle cx="30" cy="237" r="10" fill="#3265a8"/>
<text x="30" y="242" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="50" y="242" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">BMX 프리스타일은 점프·기술을 심판이 채점한다.</text>
<rect x="20" y="275" width="4" height="16" fill="#3265a8"/>
<text x="32" y="288" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">LA28 예선 구조 (위에서부터 차례로 배정)</text>
