<text x="50" y="214" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">볼더: 로프 없이 짧은 문제를 풀며 완등(Top)·존(Zone)과 시도 수로 점수를 매긴다.</text>
<circle cx="30" cy="237" r="10" fill="#3265a8"/>
<text x="30" y="242" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="50" y="242" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">스피드: 15m 표준 벽을 두 선수가 나란히 오르는 토너먼트, 부정출발은 실격이다.</text>
<rect x="20" y="275" width="4" height="16" fill="#3265a8"/>
