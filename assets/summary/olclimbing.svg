<text x="30" y="186" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="50" y="186" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">리드: 로프를 걸고 높은 벽을 올라 도달한 높이로 순위를 정한다.</text>
<circle cx="30" cy="209" r="10" fill="#3265a8"/>
