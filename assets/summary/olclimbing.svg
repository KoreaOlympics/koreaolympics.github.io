<text x="568" y="440" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">리드 · 볼더</text>
<text x="568" y="457" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle">· 스피드</text>
<text x="20" y="555" font-size="11" fill="#54595d" font-weight="normal" text-anchor="start">점선: 앞 경로에서 자리를 얻지 못한 국가·선수가 다음 경로로 넘어간다.</text>
<text x="20" y="575" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">세부 인원은 본문 예선 규정을 따른다.</text>
<text x="20" y="601" font-size="11" fill="#54595d" font-weight="normal" text-anchor="start">숫자는 이 문서의 예선 규정 정리 기준이다. 세부 조건과 출처는 본문에 있다.</text>
