<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 617" width="640" height="617" role="img" aria-label="스포츠클라이밍 한눈에 보기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>스포츠클라이밍 한눈에 보기</title><rect x="1" y="1" width="638" height="615" rx="8" fill="#fff" stroke="#c8ccd1"/>
