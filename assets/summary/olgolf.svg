<text x="242" y="130" font-size="13" fill="#202122" font-weight="normal" text-anchor="middle">없음)</text>
<path d="M314 110 L325 116 L314 122" fill="#3265a8"/>
<rect x="331" y="90" width="134" height="52" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="398" y="121" font-size="13" fill="#202122" font-weight="normal" text-anchor="middle">4라운드 72홀 합계</text>
<path d="M470 110 L480 116 L470 122" fill="#3265a8"/>
<rect x="486" y="90" width="134" height="52" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="553" y="121" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle">혼성 단체</text>
<rect x="20" y="163" width="4" height="16" fill="#3265a8"/>
<text x="32" y="176" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">핵심 규칙</text>
<circle cx="30" cy="199" r="10" fill="#3265a8"/>
<text x="30" y="204" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="50" y="204" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">4라운드 72홀 스트로크 플레이로 타수가 적은 선수가 이긴다.</text>
<circle cx="30" cy="227" r="10" fill="#3265a8"/>
<text x="30" y="232" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="50" y="232" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">메달 순위가 같으면 플레이오프로 가린다.</text>
<circle cx="30" cy="255" r="10" fill="#3265a8"/>
<text x="30" y="260" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="50" y="260" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">혼성 단체는 개인전에 나온 남녀 1명씩 16개 국가가 겨룬다.</text>
<rect x="20" y="293" width="4" height="16" fill="#3265a8"/>
<text x="32" y="306" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">LA28 예선 구조 (위에서부터 차례로 배정)</text>
<line x1="32" y1="348" x2="32" y2="396" stroke="#3265a8" stroke-width="2"/>
