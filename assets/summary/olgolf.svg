<text x="66" y="416" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">대륙 보장</text>
<rect x="566" y="402" width="46" height="22" rx="11" fill="#3265a8"/>
<text x="589" y="417" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">포함</text>
<text x="66" y="433" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">OGR 안 · 5개 대륙 최소 1명</text>
<line x1="32" y1="468" x2="32" y2="516" stroke="#3265a8" stroke-width="2"/>
<circle cx="32" cy="468" r="11" fill="#3265a8"/>
<text x="32" y="472" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<rect x="54" y="456" width="566" height="50" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="476" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">개최국</text>
<rect x="541" y="462" width="71" height="22" rx="11" fill="#3265a8"/>
<text x="577" y="477" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">성별 1명</text>
<text x="66" y="493" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">미국 미확보 시</text>
<circle cx="32" cy="528" r="11" fill="#3265a8"/>
<text x="32" y="532" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text>
<rect x="54" y="516" width="566" height="50" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="536" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">혼성 단체</text>
<rect x="563" y="522" width="49" height="22" rx="11" fill="#3265a8"/>
<text x="587" y="537" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">16팀</text>
<text x="66" y="553" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">개인전 출전 남녀로 구성</text>
<rect x="20" y="579" width="4" height="16" fill="#3265a8"/>
<text x="32" y="592" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">출전권 배분</text>
<text x="20" y="618" font-size="13" fill="#54595d" font-weight="bold" text-anchor="start">전체 120명</text>
<rect x="20.0" y="626" width="293.5" height="26" fill="#3265a8"/>
<text x="168" y="644" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">59</text>
<rect x="315.0" y="626" width="293.5" height="26" fill="#4f9a94"/>
<text x="462" y="644" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">59</text>
<rect x="610.0" y="626" width="8.5" height="26" fill="#e0a42f"/>
<rect x="20" y="661" width="12" height="12" rx="2" fill="#3265a8"/>
<text x="38" y="672" font-size="13" fill="#202122" font-weight="normal" text-anchor="start">남자 OGR 59</text>
<rect x="128" y="661" width="12" height="12" rx="2" fill="#4f9a94"/>
<text x="146" y="672" font-size="13" fill="#202122" font-weight="normal" text-anchor="start">여자 OGR 59</text>
<rect x="236" y="661" width="12" height="12" rx="2" fill="#e0a42f"/>
<text x="254" y="672" font-size="13" fill="#202122" font-weight="normal" text-anchor="start">개최국 2</text>
<text x="20" y="704" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">OGR 15위 이내는 국가당 최대 4명, 그 밖에는 최대 2명.</text>
<text x="20" y="728" font-size="11" fill="#54595d" font-weight="normal" text-anchor="start">숫자는 이 문서의 예선 규정 정리 기준이다. 세부 조건과 출처는 본문에 있다.</text>
