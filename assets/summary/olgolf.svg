<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 764" width="640" height="764" role="img" aria-label="골프 한눈에 보기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>골프 한눈에 보기</title><rect x="1" y="1" width="638" height="762" rx="8" fill="#fff" stroke="#c8ccd1"/>
