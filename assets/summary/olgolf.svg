<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 744" width="640" height="744" role="img" aria-label="골프 한눈에 보기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>골프 한눈에 보기</title><rect x="1" y="1" width="638" height="742" rx="8" fill="#fff" stroke="#c8ccd1"/>
<text x="20" y="38" font-size="22" fill="#202122" font-weight="bold" text-anchor="start">골프 한눈에 보기</text>
<text x="620" y="38" font-size="18" fill="#3265a8" font-weight="bold" text-anchor="end">120명 · 혼성 16팀</text>
<text x="620" y="58" font-size="12" fill="#54595d" font-weight="normal" text-anchor="end">LA28 출전 규모</text>
<rect x="20" y="63" width="4" height="16" fill="#3265a8"/>
<text x="32" y="76" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">경기 방식</text>
<rect x="20" y="90" width="134" height="52" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="87" y="121" font-size="13" fill="#202122" font-weight="normal" text-anchor="middle">1라운드</text>
