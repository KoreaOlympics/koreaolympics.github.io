<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 552" width="640" height="552" role="img" aria-label="육상 한눈에 보기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>육상 한눈에 보기</title><rect x="1" y="1" width="638" height="550" rx="8" fill="#fff" stroke="#c8ccd1"/>
<text x="20" y="38" font-size="22" fill="#202122" font-weight="bold" text-anchor="start">육상 한눈에 보기</text>
<text x="620" y="38" font-size="18" fill="#3265a8" font-weight="bold" text-anchor="end">48개 세부종목</text>
<text x="620" y="58" font-size="12" fill="#54595d" font-weight="normal" text-anchor="end">LA28 출전 규모</text>
<rect x="20" y="63" width="4" height="16" fill="#3265a8"/>
<text x="32" y="76" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">경기 방식</text>
<rect x="20" y="90" width="185" height="34" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="113" y="112" font-size="13" fill="#202122" font-weight="normal" text-anchor="middle">예선 라운드</text>
<path d="M210 101 L221 107 L210 113" fill="#3265a8"/>
<rect x="227" y="90" width="185" height="34" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="320" y="112" font-size="13" fill="#202122" font-weight="normal" text-anchor="middle">준결승</text>
<path d="M418 101 L429 107 L418 113" fill="#3265a8"/>
<rect x="435" y="90" width="185" height="34" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="527" y="112" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle">결승 (트랙)</text>
<rect x="20" y="145" width="4" height="16" fill="#3265a8"/>
<text x="32" y="158" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">핵심 규칙</text>
<circle cx="30" cy="181" r="10" fill="#3265a8"/>
<text x="30" y="186" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="50" y="186" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">트랙은 부정출발 1회에 바로 실격이다.</text>
<circle cx="30" cy="209" r="10" fill="#3265a8"/>
<text x="30" y="214" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="50" y="214" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">필드 결승은 3차 시기 후 상위 8명이 3번 더 겨룬다.</text>
<circle cx="30" cy="237" r="10" fill="#3265a8"/>
<text x="30" y="242" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="50" y="242" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">기록은 전자 계시 1/100초, 필드는 cm 단위로 잰다.</text>
<rect x="20" y="275" width="4" height="16" fill="#3265a8"/>
<text x="32" y="288" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">LA28 예선 구조 (위에서부터 차례로 배정)</text>
<line x1="32" y1="330" x2="32" y2="378" stroke="#3265a8" stroke-width="2"/>
<circle cx="32" cy="330" r="11" fill="#3265a8"/>
<text x="32" y="334" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<rect x="54" y="318" width="566" height="50" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="338" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">기준기록 통과</text>
<text x="66" y="355" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">예선 기간 · 기간 안에 기준 이상 기록</text>
<line x1="32" y1="390" x2="32" y2="438" stroke="#3265a8" stroke-width="2"/>
<circle cx="32" cy="390" r="11" fill="#3265a8"/>
<text x="32" y="394" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<rect x="54" y="378" width="566" height="50" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="398" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">세계랭킹</text>
<rect x="536" y="384" width="76" height="22" rx="11" fill="#3265a8"/>
<text x="574" y="399" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">남은 자리</text>
<text x="66" y="415" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">마감일 · 랭킹 순</text>
<circle cx="32" cy="450" r="11" fill="#3265a8"/>
<text x="32" y="454" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<rect x="54" y="438" width="566" height="50" rx="6" fill="#eef3fa" stroke="#d5deea"/>
<text x="66" y="458" font-size="14" fill="#202122" font-weight="bold" text-anchor="start">보편성</text>
<text x="66" y="475" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">기준 미달 국가</text>
<text x="20" y="510" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">LA28 세부 기준기록·인원은 발표 전이다.</text>
<text x="20" y="536" font-size="11" fill="#54595d" font-weight="normal" text-anchor="start">숫자는 이 문서의 예선 규정 정리 기준이다. 세부 조건과 출처는 본문에 있다.</text>
</svg>
