<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 648" width="640" height="648" role="img" aria-label="역도 한눈에 보기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>역도 한눈에 보기</title><rect x="1" y="1" width="638" height="646" rx="8" fill="#fff" stroke="#c8ccd1"/>
<text x="20" y="38" font-size="22" fill="#202122" font-weight="bold" text-anchor="start">역도 한눈에 보기</text>
