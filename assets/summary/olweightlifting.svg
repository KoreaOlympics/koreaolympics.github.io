<text x="30" y="186" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="50" y="186" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">인상과 용상을 3번씩 시도해 각 최고 기록을 더한다.</text>
<circle cx="30" cy="209" r="10" fill="#3265a8"/>
<text x="30" y="214" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="50" y="214" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">합계가 같으면 먼저 그 기록을 들어 올린 선수가 이긴다.</text>
<circle cx="30" cy="237" r="10" fill="#3265a8"/>
<text x="30" y="242" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="50" y="242" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">체급마다 10명, 국가당 성별 3명까지다.</text>
