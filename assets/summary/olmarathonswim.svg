<text x="32" y="76" font-size="15" fill="#3265a8" font-weight="bold" text-anchor="start">경기 방식</text>
<rect x="20" y="90" width="600" height="34" rx="6" fill="#eef3fa" stroke="#3265a8"/>
<text x="320" y="112" font-size="13" fill="#202122" font-weight="bold" text-anchor="middle">10km 단판 레이스</text>
