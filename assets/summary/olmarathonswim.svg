<text x="30" y="186" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="50" y="186" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">바다·호수 같은 오픈워터에서 10km를 헤엄친다.</text>
<circle cx="30" cy="209" r="10" fill="#3265a8"/>
<text x="30" y="214" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="50" y="214" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">코스의 부표를 정해진 방향으로 돌아야 한다.</text>
<circle cx="30" cy="237" r="10" fill="#3265a8"/>
<text x="30" y="242" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="50" y="242" font-size="14" fill="#202122" font-weight="normal" text-anchor="start">반칙이면 옐로·레드카드를 받는다.</text>
