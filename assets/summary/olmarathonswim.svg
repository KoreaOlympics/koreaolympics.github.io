<text x="587" y="459" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">18명</text>
<text x="66" y="475" font-size="12" fill="#54595d" font-weight="normal" text-anchor="start">2028 · 대륙 대표 5 → 개최국 → 순위</text>
<rect x="20" y="501" width="4" height="16" fill="#3265a8"/>
