<text x="339" y="594" font-size="13" fill="#202122" font-weight="normal" text-anchor="start">2028 예선대회 (개최국 포함) 18</text>
<text x="20" y="632" font-size="11" fill="#54595d" font-weight="normal" text-anchor="start">숫자는 이 문서의 예선 규정 정리 기준이다. 세부 조건과 출처는 본문에 있다.</text>
