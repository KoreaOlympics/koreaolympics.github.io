<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대한민국 선수단 경기 일정 · 2026 아이치·나고야 아시안게임</title>
<meta name="description" content="2026 아이치·나고야 아시안게임 대한민국 선수단 경기를 시간 순서로 정리 (10분마다 자동 갱신)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=2">
<style>
section { scroll-margin-top: var(--stick, 0px); }
.day-head { position: sticky; top: var(--stick, 0px); z-index: 5; background: var(--bg); padding: 16px 0 8px;
  display: flex; align-items: baseline; gap: 10px; }
.day-head h2 { margin: 0; font-size: 18px; }
.day-head .cnt { color: var(--muted); font-size: 13px; }
.day-head .today { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 6px; }
.daybox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.daybox table { table-layout: fixed; min-width: 640px; }
.daybox th:nth-child(1) { width: 64px; } .daybox th:nth-child(2) { width: 96px; } .daybox th:nth-child(3) { width: 28%; }
.daybox th:nth-child(4) { width: 30%; } .daybox th:nth-child(6) { width: 96px; }
td.sport { font-weight: 600; }
td.who { min-width: 180px; }
.ath { font-size: 13px; }
.lineup { font-size: 11px; color: var(--muted); }
.tag.man { background: #e7f0ff; color: #2456b3; }
.note { font-size: 12px; color: var(--accent); margin-top: 2px; }
.vs { font-size: 13px; }
.vs b { font-variant-numeric: tabular-nums; }
button.rid { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; padding: 0 4px; opacity: .5; }
button.rid:hover { opacity: 1; }
tr.past td:not(.st) { opacity: .6; }
.jump { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; }
.jump a { flex: 0 0 auto; text-decoration: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  padding: 4px 9px; font-size: 13px; color: var(--ink); }
.jump a b { color: var(--muted); font-weight: 600; margin-left: 3px; font-variant-numeric: tabular-nums; }
.jump a.is-today { border-color: var(--accent); color: var(--accent); }
@media (max-width: 640px) { td.venue, th.venue { display: none; } .daybox table { min-width: 0; } }
.rbtn { border: 1px solid var(--line); background: var(--panel); color: var(--accent); border-radius: 6px;
  font: inherit; font-size: 11px; font-weight: 700; padding: 1px 6px; cursor: pointer; margin-left: 6px; }
.rbtn:hover { background: var(--accent-soft); }
dialog.res { border: 0; border-radius: 14px; padding: 0; max-width: 680px; width: calc(100% - 24px); background: var(--panel); color: var(--ink); }
dialog.res::backdrop { background: rgba(0,0,0,.45); }
.res-head { display: flex; align-items: baseline; gap: 10px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.res-head h3 { margin: 0; font-size: 17px; }
.res-head .st { color: var(--muted); font-size: 12px; }
.res-head button { margin-left: auto; border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); }
.res-body { padding: 8px 18px 18px; max-height: 70vh; overflow: auto; }
.res-body table { width: 100%; border-collapse: collapse; font-size: 13px; }
.res-body th, .res-body td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.res-body th:nth-child(2), .res-body td:nth-child(2) { text-align: left; white-space: normal; }
.res-body th { font-size: 11px; color: var(--muted); }
.res-body tr.kor td { background: var(--accent-soft); font-weight: 700; }
.res-body tr.kor td:nth-child(2) { color: var(--accent); }
.res-score { font-size: 22px; font-weight: 800; text-align: center; padding: 10px 0 4px; font-variant-numeric: tabular-nums; }
.res-note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.res-sub { margin: 16px 0 4px; font-size: 14px; }
.res-sub:first-child { margin-top: 8px; }

/* Phones: each game is a compact card (time, sport, event, athletes); tap it for TV, notes, venue and status. */
.detail-toggle { display: none; }
@media (max-width: 640px) {
  .detail-toggle { display: inline-flex; }
  .res-body { padding: 6px 10px 14px; }
  .res-body table { font-size: 12px; }
  .res-body th, .res-body td { padding: 5px 4px; }
  .res-head { padding: 12px 12px 8px; }
  .jump { padding: 8px 0 6px; }
  .daybox table { min-width: 0; table-layout: auto; }
  .daybox thead { display: none; }
  .daybox tbody { display: block; }
  .daybox tr { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .daybox tr:last-child { border-bottom: 0; }
  .daybox td { display: block; padding: 0; border: 0; width: auto; min-width: 0; }
  .daybox td.time { grid-column: 1; grid-row: 1 / span 3; }
  .daybox td.sport { grid-column: 2; font-size: 12px; font-weight: 700; color: var(--muted); }
  .daybox td.sport::after { content: "자세히 ▾"; float: right; font-weight: 400; opacity: .7; }
  .daybox tr.open td.sport::after, body.detail .daybox td.sport::after { content: ""; }
  .daybox tr.open td.sport::after { content: "접기 ▴"; }
  .daybox td.ev, .daybox td.who { grid-column: 2; }
  .daybox td.ev .unit { font-size: 14px; }
  .daybox td.venue, .daybox td.st, .daybox .tvline, .daybox .note, .daybox .lineup, .daybox .tag.man { display: none; }
  .daybox tr.open td.venue, .daybox tr.open td.st, .daybox tr.open .tvline, .daybox tr.open .note, .daybox tr.open .lineup,
  body.detail .daybox td.venue, body.detail .daybox td.st, body.detail .daybox .tvline, body.detail .daybox .note,
  body.detail .daybox .lineup { display: block; }
  .daybox tr.open .tag.man, body.detail .daybox .tag.man { display: inline-block; }
  .daybox tr.open td.venue, body.detail .daybox td.venue { grid-column: 2; margin-top: 4px; font-size: 12px; }
  .daybox tr.open td.st, body.detail .daybox td.st { grid-column: 2; margin-top: 4px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <nav class="toplinks"><a class="home" href="index.html">← 전체 일정</a><span><a class="home" href="brackets.html">🏆 구기종목 대진표</a> · <a class="home" href="../index2.html">아시안게임 페이지</a></span></nav>
    <h1>🇰🇷 대한민국 선수단 경기 일정</h1>
    <p>시간 순서 · 현지시간(= 한국시간) · 10분마다 자동 갱신 · <span id="updated"></span></p>
  </header>
</div>
<div class="sticky" id="stickybar">
  <div class="wrap">
    <nav class="jump" id="jump" aria-label="날짜 이동"></nav>
    <div class="controls">
      <input type="search" id="q" placeholder="검색: 선수 이름, 종목, 세부종목, 상대국…">
      <label class="toggle"><input type="checkbox" id="showPast"> 지난 날짜 보기</label>
      <label class="toggle"><input type="checkbox" id="onlyMedal"> 🏅 메달 결정</label>
      <label class="toggle detail-toggle"><input type="checkbox" id="allDetail"> 모두 자세히</label>
    </div>
  </div>
</div>
<dialog class="res" id="resDlg">
  <div class="res-head"><h3 id="resTitle"></h3><span class="st" id="resStatus"></span><button id="resClose" aria-label="닫기">×</button></div>
  <div class="res-body" id="resBody"></div>
</dialog>
<main class="wrap">
  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <footer>
    <b>자동</b>: 공식 대진·출전명단에 대한민국이 포함되면 10분 안에 자동으로 추가됩니다(주로 단체 구기·토너먼트).
    <b>직접 추가</b>: 개인전 등은 <code>schedule/kor_manual.json</code>의 <code>add</code>에 입력하면 표시됩니다. 각 행의 <b>#</b>을 누르면 행 ID가 복사됩니다(메모·숨기기에 사용).
    데이터 출처: <a href="https://results.asiangames2026.org/" target="_blank" rel="noopener">results.asiangames2026.org</a>
  </footer>
</main>

<script src="common.js"></script>
<script>
const $ = s => document.querySelector(s);
const COL_KO = { VICT: "승", DEF: "패", PEN: "반칙", PENALTIES: "반칙", POINTS: "점수", TOTAL: "합계", TIME: "기록",
  SCORE: "점수", TOTAL_POINTS: "총점", SETS: "세트", GOALS: "득점", DIFF: "차이", LAPS: "랩", REACTION_TIME: "반응",
  TOUCHES_SCORED: "찌른 수", TOUCHES_RECEIVED: "맞은 수" };
const state = { items: [], manual: {}, results: new Set(), q: "", showPast: false, onlyMedal: false, today: "", open: new Set() };
const nowJST = () => new Date(Date.now() + 9 * 3600e3).toISOString();

const bust = u => `${u}?t=${Date.now()}`;
async function loadAll() {
  const [items, manual, index] = await Promise.all([
    fetch(bust("data/kor.json"), { cache: "no-store" }).then(r => r.json()),
    fetch(bust("kor_manual.json"), { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch(bust("data/index.json"), { cache: "no-store" }).then(r => r.json()),
  ]);
  state.items = items; state.manual = manual || {};
  state.results = new Set(await fetch(bust("data/results_index.json"), { cache: "no-store" }).then(r => r.ok ? r.json() : []).catch(() => []));
  state.today = nowJST().slice(0, 10);
  $("#updated").textContent = `마지막 갱신: ${new Date(index.updated).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" })}`;
}

function rows() {
  const m = state.manual, names = m.names || {}, hide = new Set(m.hide || []);
  const nm = s => (s || "").split(/\s*\/\s*/).map(p => names[p] || p).join(" / ");
  const out = state.items.filter(x => !hide.has(x.id)).map(x => ({
    ...x,
    athletes: (m.athletes || {})[x.id] || (x.athletes || []).map(nm),
    manualAthletes: !!(m.athletes || {})[x.id],
    note: (m.notes || {})[x.id] || "",
    tv: (m.tv || {})[x.id],
    home: x.home && { ...x.home, nameKo: x.home.org === "KOR" && !x.home.team ? nm(x.home.nameKo) : x.home.nameKo },
    away: x.away && { ...x.away, nameKo: x.away.org === "KOR" && !x.away.team ? nm(x.away.nameKo) : x.away.nameKo },
  }));
  (m.add || []).filter(a => a.date && a.time).forEach((a, i) => out.push({
    id: `manual/${i}`, kind: "manual", date: a.date, time: a.time, dt: `${a.date}T${a.time}:00+09:00`,
    sportName: a.sport || "", unit: a.title || "", athletes: [].concat(a.athletes || []), vs: a.vs || "",
    venue: a.venue || "", note: a.note || "", status: "", medal: a.medal ? "1" : "", tv: a.tv,
  }));
  return out.sort((a, b) => a.dt.localeCompare(b.dt));
}

function who(x) {
  if (x.home || x.away) {
    const [k, o] = x.home?.org === "KOR" ? [x.home, x.away] : [x.away, x.home];
    const score = k?.result || o?.result ? ` <b>${esc(k?.result ?? "")} : ${esc(o?.result ?? "")}</b>` : "";
    const res = k?.win ? " · 승" : o?.win ? " · 패" : "";
    return `<div class="vs"><span class="kor">${esc(k?.nameKo || "대한민국")}</span> vs ${esc(o ? (o.nameKo || o.name) : "미정")}${score}${res}</div>` +
      (x.athletes.length ? `<div class="ath">${esc(x.athletes.join(", "))}</div>` : "");
  }
  const vs = x.vs ? `<div class="vs">vs ${esc(x.vs)}</div>` : "";
  // lineup comes from the unit's official start list; before it is out the names are everyone entered in the event
  const src = x.manualAthletes ? "" : x.lineup === "entries" && x.athletes.length > 1 ? `<div class="lineup">엔트리 기준 · 출전 명단 발표 전</div>`
    : x.lineup === "none" ? `<div class="lineup">출전 한국 선수 없음</div>` : "";
  return (x.athletes.length ? `<div class="ath">${esc(x.athletes.join(", "))}</div>` : x.lineup === "none" ? "" : `<div class="ath">대한민국</div>`) + vs + src;
}

function row(x) {
  const tag = x.kind === "manual" ? `<span class="tag man">직접 추가</span>` : "";
  const medal = x.medal === "1" ? `<span class="tag gold">메달</span>` : x.medal === "2" ? `<span class="tag bronze">동메달전</span>` : "";
  const live = /Running|Live/.test(x.status || "") ? `<span class="tag live">LIVE</span>` : "";
  const venue = [x.venue, x.loc && x.loc !== x.venue ? x.loc : ""].filter(Boolean).map(esc).join(" · ");
  const past = x.dt < nowJST().slice(0, 16) && /Official|Unofficial|Finished/.test(x.status || "");
  return `<tr class="${past ? "past" : ""} ${state.open.has(x.id) ? "open" : ""}" data-row="${esc(x.id)}">
    <td class="time">${esc(x.hideTime ? (x.est || "TBD") : x.time)}${x.endTime && x.endTime !== x.time ? `<div class="ath">~${esc(x.endTime)}</div>` : ""}</td>
    <td class="sport">${esc(x.sportName || KO[x.disc] || x.discDesc || "")}</td>
    <td class="ev"><div class="unit" title="${esc(x.unitEn || "")}">${esc(!/조/.test(x.unit || "") && /조/.test(x.phase || "") ? `${x.phase.replace(/^예선\s*-\s*/, "")} ${x.unit}` : x.unit)}${medal}${live}</div>${tag ? `<div>${tag}</div>` : ""}${tvLine(x.tv)}${x.note ? `<div class="note">📝 ${esc(x.note)}</div>` : ""}</td>
    <td class="who">${who(x)}</td>
    <td class="venue">${venue}</td>
    <td class="st">${esc(STATUS_KO[x.status] || x.status || "")}${state.results.has(x.id.replace(/\//g, "_")) ? `<button class="rbtn" data-res="${esc(x.id)}">결과</button>` : ""}<button class="rid" data-id="${esc(x.id)}" title="행 ID 복사: ${esc(x.id)}">#</button></td></tr>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const all = rows();
  const list = all.filter(x =>
    (state.showPast || x.date >= state.today) &&
    (!state.onlyMedal || x.medal === "1" || x.medal === "2") &&
    (!q || [KO[x.disc], x.sportName, x.discDesc, x.unit, x.unitEn, x.phase, x.athletes.join(" "), x.vs, x.note,
      x.home?.nameKo, x.home?.name, x.away?.nameKo, x.away?.name, x.venue].join(" ").toLowerCase().includes(q)));

  const byDate = new Map();
  list.forEach(x => { if (!byDate.has(x.date)) byDate.set(x.date, []); byDate.get(x.date).push(x); });
  const label = d => { const [, m, dd] = d.split("-"); return `${+m}월 ${+dd}일 (${WD[new Date(d + "T12:00:00Z").getUTCDay()]})`; };

  $("#jump").innerHTML = [...byDate].map(([d, xs]) =>
    `<a href="#d-${d}" class="${d === state.today ? "is-today" : ""}">${label(d).replace(/ \(.\)/, "")}<b>${xs.length}</b></a>`).join("");
  const manual = list.filter(x => x.kind === "manual").length;
  $("#summary").textContent = `${byDate.size}일 · ${list.length}건${manual ? ` (직접 추가 ${manual}건 포함)` : ""}`;
  $("#list").innerHTML = byDate.size ? [...byDate].map(([d, xs]) => `
    <section id="d-${d}">
      <div class="day-head"><h2>${label(d)}</h2>${d === state.today ? `<span class="today">오늘</span>` : ""}<span class="cnt">${xs.length}건</span></div>
      <div class="daybox tbl"><table><thead><tr><th>시간</th><th>종목</th><th>세부종목 / 경기</th><th>선수 · 대진</th><th class="venue">경기장</th><th>상태</th></tr></thead>
      <tbody>${xs.map(row).join("")}</tbody></table></div>
    </section>`).join("") : `<div class="empty-msg">조건에 맞는 경기가 없습니다.</div>`;
  document.documentElement.style.setProperty("--stick", $("#stickybar").offsetHeight + "px");
}

async function showResult(id) {
  const names = state.manual.names || {};
  const nm = s => (s || "").split(/\s*\/\s*/).map(p => names[p] || p).join(" / ");
  $("#resTitle").textContent = "불러오는 중…"; $("#resStatus").textContent = ""; $("#resBody").innerHTML = "";
  $("#resDlg").showModal();
  let d;
  try { d = await fetch(bust(`data/results/${id.replace(/\//g, "_")}.json`), { cache: "no-store" }).then(r => r.json()); }
  catch (e) { $("#resTitle").textContent = "결과를 불러오지 못했습니다"; return; }
  // the schedule's own Korean unit name reads better than the results feed's title
  const row = rows().find(r => r.id === id);
  $("#resTitle").textContent = [row && (KO[row.disc] || row.sportName), row ? row.unit : d.title].filter(Boolean).join(" · ");
  $("#resStatus").textContent = [STATUS_KO[d.status] || d.status, d.venue].filter(Boolean).join(" · ");
  const head = d.competitors.length === 2 && d.competitors.every(c => c.res !== "")
    ? `<div class="res-score">${d.competitors.map(c => `${esc(c.name)} <b>${esc(c.res)}</b>`).join(" : ")}</div>`
    + (d.periods.length ? `<p class="res-note">${d.periods.map(p => `${esc(p.name)} ${esc(p.home)}-${esc(p.away)}`).join(" · ")}</p>` : "")
    : "";
  const trs = d.competitors.map(c => `<tr class="${c.org === "KOR" ? "kor" : ""}">
      <td>${esc(c.rk)}</td><td>${esc(c.org)} ${esc(nm(c.name))}${c.medal ? " 🏅" : ""}</td>
      ${d.cols.map(k => `<td>${esc(c.cols[k] ?? "")}</td>`).join("")}
      ${d.showRes ? `<td>${esc(c.res)}${c.irm && c.irm !== "OK" ? " " + esc(c.irm) : ""}</td>` : ""}</tr>`).join("");
  $("#resBody").innerHTML = head + totalTable(d.total, nm) + (d.total ? `<h4 class="res-sub">이 종목 순위</h4>` : "") +
    `<table><thead><tr><th>순위</th><th>선수 · 팀</th>
    ${d.cols.map(k => `<th>${esc(COL_KO[k] || k)}</th>`).join("")}${d.showRes ? "<th>기록</th>" : ""}</tr></thead><tbody>${trs}</tbody></table>
    <p class="res-note">공식 결과 사이트 기준 · 10분마다 갱신</p>`;
}

// Modern pentathlon: summed standings across its parts (each part's own table only ranks that part).
const PART_KO = { FE: "펜싱", OB: "장애물", SW: "수영", LR: "레이저런" };
function totalTable(t, nm) {
  if (!t) return "";
  const trs = t.rows.map(r => `<tr class="${r.org === "KOR" ? "kor" : ""}">
      <td>${r.tie ? "=" : ""}${r.rk}</td><td>${esc(r.org)} ${esc(nm(r.name))}${r.irm ? ` <small>${esc(r.irm)}</small>` : ""}</td>
      <td><b>${r.sum}</b></td>${t.parts.map(p => `<td>${r.parts[p] ?? "–"}</td>`).join("")}</tr>`).join("");
  return `<h4 class="res-sub">합산 순위 (${t.parts.map(p => PART_KO[p]).join("+")})</h4>
    <table><thead><tr><th>순위</th><th>선수</th><th>합계</th>${t.parts.map(p => `<th title="${PART_KO[p]}">${PART_KO[p][0]}</th>`).join("")}</tr></thead><tbody>${trs}</tbody></table>
    <p class="res-note">${t.complete ? "" : "아직 끝나지 않은 종목이 있어 현재까지의 합계입니다. "}종목별 점수를 더한 값이며, 공식 최종 순위와 다를 수 있습니다. =는 동점.</p>`;
}

async function init() {
  await loadAll(); render();
  let t; $("#q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; render(); }, 150); });
  for (const id of ["showPast", "onlyMedal"]) $("#" + id).addEventListener("change", e => { state[id] = e.target.checked; render(); });
  $("#allDetail").addEventListener("change", e => document.body.classList.toggle("detail", e.target.checked));
  $("#resClose").addEventListener("click", () => $("#resDlg").close());
  $("#resDlg").addEventListener("click", e => { if (e.target === $("#resDlg")) $("#resDlg").close(); });
  $("#list").addEventListener("click", async e => {
    const r = e.target.closest("button.rbtn");
    if (r) return showResult(r.dataset.res);
    const b = e.target.closest("button.rid");
    if (!b) {
      // phones: tapping a card shows or hides its details
      const tr = e.target.closest("tr[data-row]");
      if (tr && !e.target.closest("a, button") && matchMedia("(max-width: 640px)").matches) {
        const id = tr.dataset.row;
        state.open.has(id) ? state.open.delete(id) : state.open.add(id);
        tr.classList.toggle("open", state.open.has(id));
      }
      return;
    }
    try { await navigator.clipboard.writeText(b.dataset.id); b.textContent = "✓"; } catch { prompt("행 ID", b.dataset.id); }
    setTimeout(() => b.textContent = "#", 1200);
  });
  window.addEventListener("resize", () => document.documentElement.style.setProperty("--stick", $("#stickybar").offsetHeight + "px"));
  setInterval(async () => { try { await loadAll(); render(); } catch (e) {} }, 10 * 60 * 1000);
}
init();
</script>
</body>
</html>
