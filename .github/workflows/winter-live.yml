# 동계 4종목(쇼트트랙·스피드·피겨·스노보드) 일정·결과 수집 + 한국 선수 AI 칼럼.
# quick: 10분마다 진행 중/±1일 대회만. full: 하루 두 번 시즌 전체 달력·일정.
name: Winter live
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '41 5,17 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Refresh the whole season'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: winter-live
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        run: |
          if [ "${{ github.event.schedule }}" = "41 5,17 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            python -m tools.winter.collect --full
          else
            python -m tools.winter.collect
          fi
      - name: AI columns
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -q 'anthropic>=1,<2' && python -m tools.winter.column; fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/winter
          # status.json alone changes every run; only publish when real data changed (or on full runs)
          if git diff --cached --quiet -- . ':(exclude)data/winter/status.json' && [ "${{ github.event.schedule }}" != "41 5,17 * * *" ]; then
            echo "no data changes"; exit 0
          fi
          git commit -q -m "winter: update live data"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          git diff --quiet HEAD @{u} || exit 1
          # bot pushes do not trigger push-based deploys; start the Pages deploy explicitly
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
