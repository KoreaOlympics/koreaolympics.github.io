# 동계 일정·결과 수집: ISU(쇼트트랙·스피드·피겨), FIS(알파인·크로스컨트리·스키점프·노르딕 복합·프리스타일·스노보드), IBU(바이애슬론),
# IBSF·FIL(봅슬레이·스켈레톤·루지, 일정만).
# GitHub 예약 실행은 혼잡하면 몇 시간씩 밀리므로, 한 번 실행되면 대회 중에는 10분 간격으로 약 50분 반복하고
# 끝날 때 다음 실행을 직접 이어 붙인다. 시간마다 도는 예약은 사슬이 끊겼을 때의 예비다.
name: Winter live
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '41 5,17 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Refresh the whole season first'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: winter-live
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect, publish, repeat while events are live
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          flag=""; force=""
          if [ "${{ github.event.schedule }}" = "41 5,17 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then flag="--full"; force="force"; fi
          end=$((SECONDS + 50*60))
          while :; do
            python -m tools.winter.collect $flag || true
            python tools/olympic.py winter
            # AI 칼럼(tools/winter/column.py)은 보류 중
            tools/winter/publish.sh $force
            flag=""; force=""
            active=$(python -c "import json;print(len(json.load(open('data/winter/status.json')).get('active',[])))")
            echo "active events: $active"
            if [ "$active" = 0 ] || [ $SECONDS -ge $end ]; then break; fi
            sleep 600
          done
          echo "ACTIVE=$active" >> "$GITHUB_ENV"
      - name: Chain the next run while events are live
        if: env.ACTIVE != '0'
        run: gh workflow run winter-live.yml --ref main
