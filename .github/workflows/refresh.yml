# 자료 갱신 한 곳: 매일 자동 자료를 다시 읽고, 자료 파일(data/)을 손으로 고쳐 올리면 바로 문서를 다시 만든다.
# - 매일(예약·수동 실행): 유도·펜싱·배드민턴·탁구 랭킹, 수영 기록, 하계 대회 결과 전체, 역도 잠정 OQR을 다시 읽는다. 하나가 실패해도 나머지는 계속한다.
# - 푸시(data/ 변경): 읽지 않고, 고친 파일의 기준일(asof)을 오늘로 맞춘 뒤 문서만 다시 만든다.
# 바뀐 것이 있을 때만 커밋 한 번·배포 한 번. 매시 실시간(summer-live·winter-live)은 따로 돈다.
name: Refresh
on:
  schedule:
    - cron: '17 20 * * *'   # 05:17 KST
  push:
    branches: [main]
    paths: ['data/**.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read sources (daily)
        if: github.event_name != 'push'
        run: |
          python tools/update/update_ijf_rankings.py & python tools/update/update_fie_rankings.py & python tools/private_rankings.py totalintel &
          python tools/update/update-swimming-records.py & python tools/update/update-swimming-benchmarks.py &
          # 배드민턴(브라우저 필요)·탁구 랭킹: 저장소 밖에 Playwright를 깔아 쓴다
          (cd "$RUNNER_TEMP" && npm i --silent playwright && npx playwright install --with-deps chromium >/dev/null && cd "$GITHUB_WORKSPACE" && NODE_PATH="$RUNNER_TEMP/node_modules" node tools/update/update-racket-rankings.cjs) &
          python tools/summer_live.py collect --all || true
          wait || true
      - name: Stamp edited data (push)
        if: github.event_name == 'push'
        run: |
          git diff --name-only ${{ github.event.before }} HEAD -- data 2>/dev/null | xargs -r python tools/explore.py stamp
      - name: Rebuild pages
        run: |
          python tools/qualified.py
          python tools/pathways.py
          python tools/private_rankings.py render
          python tools/summer_live.py render
          python tools/summer_pages.py
          python tools/olympic.py build
          python tools/explore.py ${{ github.event_name != 'push' && '--checked' || '' }}
          python tools/olympic.py check
      - name: Commit and deploy once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/pathways '*.html'
          if git diff --cached --quiet -- . ':!data/freshness.json' ':!updates.html' && [ "${{ github.event_name }}" = push ]; then echo "no changes"; exit 0; fi
          git commit -q -m "refresh: update data and pages"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
          gh workflow run pages.yml --ref main   # 봇 푸시는 배포를 부르지 않는다
