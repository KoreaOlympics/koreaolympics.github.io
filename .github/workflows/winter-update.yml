name: Update winter results and calendar
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: winter-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public results
        id: collect
        continue-on-error: true
        run: node scripts/update-winter.cjs
      - name: Render saved data
        run: node scripts/render-winter.cjs
      - name: Publish updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/winter-live.json wishorttrack.html wifigure.html wispeedskating.html wicurling.html index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "winter: refresh results and annual calendar"
          git pull --rebase
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report source failures
        if: steps.collect.outcome == 'failure'
        run: exit 1
