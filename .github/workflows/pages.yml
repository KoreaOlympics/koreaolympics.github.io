# 사이트 배포. 예전에는 동계 갱신 워크플로가 배포를 겸했다.
# 봇 커밋(데이터 갱신)은 push 이벤트를 만들지 않으므로 갱신 워크플로가 끝날 때도 배포한다.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily IJF rankings', 'FIE team ranking update', 'Update AG2026 schedule']
    types: [completed]
permissions:
  contents: write  # 내용 보호(guard)가 되살린 내용을 커밋한다
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3000  # 내용 보호가 옛 판을 알아보는 데 쓴다
      # 내용 보호: 업로드·덮어쓰기로 사라진 섹션(파리 메달·예선 규정·확정 국가 등)과 자동 블록을 되살린 뒤 배포한다.
      # 일부러 지운 경우 커밋 메시지에 [guard skip]을 넣는다.
      - name: Guard content
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[guard skip]') && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          python3 tools/guard.py ${{ github.event.before }}
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -qam "guard: 덮어쓴 내용 되살리기"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
