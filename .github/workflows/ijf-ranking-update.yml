name: Daily IJF rankings
on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ijf-ranking-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/update_ijf_rankings.py
      - name: Save validated rankings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ijf-ranking.json data/ijf-history
          if ! git diff --cached --quiet; then
            git commit -m 'Update official IJF ranking snapshot'
            git push
          fi
