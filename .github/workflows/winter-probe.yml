name: Winter source probe
on:
  push:
    branches: [claude/winter-probe]
    paths: [probe/urls.txt, probe/probe.py, probe/js.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py probe/urls.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached probe/out 2>/dev/null; git add probe/out && git commit -q -m "probe: output" && git push -q
