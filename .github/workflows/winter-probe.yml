name: Winter source probe
on:
  push:
    branches: [claude/winter-probe]
    paths: [probe/urls.txt, probe/probe.py, probe/js.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py probe/urls.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe/out
