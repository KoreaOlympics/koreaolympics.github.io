# 임시: 동계 수집 확장(FIS·IBU·IBSF·FIL)을 위해 원본 페이지를 받아 아티팩트로 남긴다. 작업 브랜치에서만 돈다.
name: Winter source probe
on:
  push:
    branches: [claude/winter-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python probe/probe.py
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe-out}
