name: Winter source probe
on:
  push:
    branches: [claude/winter-probe]
    paths: [probe/**, .github/workflows/winter-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py probe/urls.txt
      - if: always()
        run: |
          cd probe/out
          git init -q -b probe-out
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "probe output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out:claude/winter-probe-out
