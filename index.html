<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 아이치·나고야 아시안게임 - 메인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#f8f9fa; --border:#c8ccd1; --border-soft:#eaecf0;
    --ink:#202122; --muted:#54595d; --link:#3366cc; --link-visited:#795cb2;
    --serif:'Noto Serif KR',Georgia,'Times New Roman',serif;
    --sans:'Pretendard','Helvetica Neue',Arial,sans-serif;
    --sun:#ba0000; --gold:#a05a00;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;}
  a{color:var(--link);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:820px;margin:0 auto;padding:60px 20px 100px;}
  header.hero{text-align:center;padding-bottom:28px;margin-bottom:36px;border-bottom:1px solid var(--border);}
  .eyebrow{display:block;font-size:12.5px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4.5vw,40px);line-height:1.3;margin:0 0 10px;}
  h1 em{font-style:normal;color:var(--sun);}
  .lede{color:var(--muted);font-size:14.5px;margin:0;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .gate{border:1px solid var(--border);border-radius:2px;background:var(--panel);padding:24px 22px;text-decoration:none;color:var(--ink);display:block;transition:box-shadow .15s,border-color .15s;}
  .gate:hover{border-color:var(--accent,var(--link));box-shadow:0 3px 12px rgba(0,0,0,.06);text-decoration:none;}
  .gate-num{font-family:var(--serif);font-size:12.5px;color:var(--accent,var(--link));font-weight:700;letter-spacing:0.05em;}
  .gate-title{font-family:var(--serif);font-weight:700;font-size:21px;margin:6px 0 8px;color:var(--ink);}
  .gate-note{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 10px;}
  .gate-go{font-size:13px;font-weight:600;color:var(--accent,var(--link));}
  footer{margin-top:40px;text-align:center;font-size:12px;color:var(--muted);}
  @media (max-width:560px){.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">2026 Aichi · Nagoya</span>
    <h1>제20회 아이치·나고야<br><em>아시안게임</em></h1>
    <p class="lede">보고 싶은 페이지를 선택하세요.</p>
  </header>
  <main class="cards">
    <a class="gate" href="index1.html" style="--accent:var(--sun)">
      <span class="gate-num">01</span>
      <p class="gate-title">올림픽예선 페이지</p>
      <p class="gate-note">올림픽 진출을 위한 예선 관련 정보를 확인합니다.</p>
      <span class="gate-go">바로가기 →</span>
    </a>
    <a class="gate" href="index2.html" style="--accent:var(--gold)">
      <span class="gate-num">02</span>
      <p class="gate-title">아시안게임 페이지</p>
      <p class="gate-note">아이치·나고야 아시안게임 종목별 안내로 이동합니다.</p>
      <span class="gate-go">바로가기 →</span>
    </a>
  </main>
  <footer>index.html → 01 index1.html · 02 index2.html</footer>
</div>
</body>
</html>
