<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 아이치·나고야 아시안게임 · 메인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1A2B; --ink-2:#152540; --gold:#C9A24B; --gold-soft:#E4CD8C;
    --sun:#D8482F; --paper:#F3EFE4; --paper-dim:#B9C2CF; --line:rgba(201,162,75,0.28);
    --jade:#4C9F86;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(216,72,47,0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(201,162,75,0.12), transparent 60%),
      var(--ink);
    color:var(--paper); font-family:'Pretendard','Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:900px; padding:64px 28px;}
  header.hero{text-align:center; margin-bottom:48px; display:flex; flex-direction:column; gap:16px; align-items:center;}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;letter-spacing:0.18em;color:var(--gold-soft);text-transform:uppercase;font-weight:600;}
  .eyebrow::before,.eyebrow::after{content:"";width:26px;height:1px;background:var(--gold);display:inline-block;}
  h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(30px,5vw,50px);line-height:1.2;margin:0;letter-spacing:-0.01em;}
  h1 em{font-style:normal;color:var(--sun);}
  .lede{max-width:560px;color:var(--paper-dim);font-size:16px;line-height:1.7;margin:0;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .gate{
    position:relative; text-decoration:none; color:var(--paper);
    display:flex; flex-direction:column; gap:14px;
    padding:36px 32px 32px; border-radius:6px; overflow:hidden;
    background:linear-gradient(160deg, rgba(21,37,64,0.9), rgba(14,26,43,0.65));
    border:1px solid var(--line); border-top:3px solid var(--accent, var(--gold));
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .gate::before{
    content:attr(data-mark); position:absolute; right:20px; top:14px;
    font-family:'Noto Serif KR',serif; font-size:96px; font-weight:900;
    color:var(--accent, var(--gold)); opacity:0.10; line-height:1; pointer-events:none;
  }
  .gate:hover, .gate:focus-visible{transform:translateY(-4px); border-color:var(--accent, var(--gold)); box-shadow:0 18px 40px rgba(0,0,0,0.35); outline:none;}
  .gate-num{font-family:'Noto Serif KR',serif; font-size:14px; letter-spacing:0.1em; color:var(--accent, var(--gold)); font-weight:700;}
  .gate-title{font-family:'Noto Serif KR',serif; font-weight:700; font-size:26px; margin:0; line-height:1.3;}
  .gate-note{font-size:13.5px; color:var(--paper-dim); line-height:1.6; margin:0;}
  .gate-go{margin-top:6px; display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--accent, var(--gold));}
  .gate-go svg{width:16px;height:16px;transition:transform .25s ease;}
  .gate:hover .gate-go svg{transform:translateX(4px);}
  footer{margin-top:44px;text-align:center;font-size:12px;color:var(--paper-dim);}
  @media (max-width:640px){.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">2026 Aichi · Nagoya</span>
    <h1>제20회 아이치·나고야<br><em>아시안게임</em></h1>
    <p class="lede">보고 싶은 페이지를 선택하세요.</p>
  </header>
  <main class="cards">
    <a class="gate" href="index1.html" style="--accent:var(--sun)" data-mark="豫">
      <span class="gate-num">01</span>
      <p class="gate-title">올림픽예선 페이지</p>
      <p class="gate-note">올림픽 진출을 위한 예선 관련 정보를 확인합니다.</p>
      <span class="gate-go">바로가기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </a>
    <a class="gate" href="index2.html" style="--accent:var(--gold)" data-mark="亞">
      <span class="gate-num">02</span>
      <p class="gate-title">아시안게임 페이지</p>
      <p class="gate-note">아이치·나고야 아시안게임 종목별 안내로 이동합니다.</p>
      <span class="gate-go">바로가기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </a>
  </main>
  <footer>index.html → 01 index1.html · 02 index2.html</footer>
</div>
</body>
</html>
