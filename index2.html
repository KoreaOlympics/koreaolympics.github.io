<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 아이치·나고야 아시안게임 종목 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#f8f9fa; --border:#c8ccd1; --border-soft:#eaecf0;
    --ink:#202122; --muted:#54595d; --link:#3366cc; --link-visited:#795cb2;
    --serif:'Noto Serif KR',Georgia,'Times New Roman',serif;
    --sans:'Pretendard','Helvetica Neue',Arial,sans-serif;
    --gold:#a05a00; --sun:#ba0000; --jade:#1a7f37; --plum:#6b3fa0;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink); font-family:var(--sans);
  }
  .wrap{max-width:1100px;margin:0 auto;padding:36px 24px 90px;}
  header.hero{display:flex;flex-direction:column;gap:14px;padding-bottom:24px;margin-bottom:32px;border-bottom:1px solid var(--border);}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase;font-weight:600;}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4.2vw,38px);line-height:1.28;margin:0;color:var(--ink);}
  h1 em{font-style:normal;color:var(--sun);}
  .lede{max-width:640px;color:var(--muted);font-size:14.5px;line-height:1.7;margin:0;}
  .stat-row{display:flex;gap:28px;margin-top:4px;flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat b{font-family:var(--serif);font-size:22px;color:var(--gold);}
  .stat span{font-size:11.5px;color:var(--muted);letter-spacing:0.03em;}

  /* Featured 2x2 section */
  .featured-section{margin-bottom:44px;}
  .featured-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .featured-heading h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;color:var(--ink);border:none;padding:0;}
  .featured-heading span{font-size:12px;color:var(--muted);}
  .featured-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .fcard{
    position:relative;border-radius:2px;padding:18px 20px 16px;
    background:var(--panel);
    border:1px solid var(--border); border-left:3px solid var(--accent, var(--gold));
    overflow:hidden;
  }
  .fcard::before{
    content:attr(data-mark); position:absolute; right:14px; top:10px;
    font-family:var(--serif); font-size:40px; font-weight:700;
    color:var(--accent, var(--gold)); opacity:0.10; line-height:1; pointer-events:none;
  }
  .fcard-eyebrow{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent, var(--gold)); font-weight:700; margin:0 0 6px;}
  .fcard-title{font-family:var(--serif); font-weight:700; font-size:18px; margin:0 0 4px; color:var(--ink);}
  .fcard-note{font-size:12.5px; color:var(--muted); margin:0 0 14px; line-height:1.5;}
  .fpills{display:flex; flex-wrap:wrap; gap:7px; position:relative; z-index:1;}
  .fpills a{
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:600;
    padding:6px 12px; border-radius:2px; border:1px solid var(--border);
    background:#fff; transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .fpills a:hover, .fpills a:focus-visible{background:var(--accent, var(--gold)); border-color:var(--accent, var(--gold)); color:#fff; text-decoration:none;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:2px;overflow:hidden;transition:border-color .2s ease;}
  .card.open{border-color:var(--link);}
  .card-head{width:100%;text-align:left;background:var(--panel);border:none;color:var(--ink);padding:16px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-family:inherit;}
  .card-head:focus-visible{outline:2px solid var(--link);outline-offset:2px;}
  .card-num{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:0.06em;display:block;margin-bottom:8px;}
  .card-title{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--ink);margin:0;line-height:1.3;}
  .card-count{font-size:11.5px;color:var(--muted);margin-top:6px;display:block;}
  .chevron{flex:none;width:20px;height:20px;color:var(--gold);transition:transform .25s ease;margin-top:4px;}
  .card.open .chevron{transform:rotate(135deg);}
  .subwrap{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .card.open .subwrap{max-height:900px;}
  .sublist{display:flex;flex-direction:column;gap:6px;padding:0 18px 18px;margin:0;border-top:1px solid var(--border-soft);padding-top:12px;}
  .sublist a{text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--border-soft);padding:10px 14px;border-radius:2px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .15s ease, border-color .15s ease;}
  .sublist a:hover, .sublist a:focus-visible{background:#eaf1ff;border-color:var(--link);text-decoration:none;}
  .lbl{font-size:14px;font-weight:600;color:var(--ink);}
  .arrow{flex:none;width:13px;height:13px;color:var(--link);opacity:.8;}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);}
  @media (max-width:720px){.featured-grid{grid-template-columns:1fr;}}
  @media (max-width:520px){.wrap{padding:28px 16px 60px;}.stat-row{gap:18px;}}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .chevron, .subwrap, .card, .fpills a{transition:none;}
  }
  .corner-nav{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:24px;}
  .corner-nav a{color:var(--muted);font-weight:600;padding:6px 12px;border:1px solid var(--border);border-radius:20px;background:var(--panel);}
  .corner-nav a:hover{color:var(--gold);border-color:var(--gold);text-decoration:none;}
  @media (max-width:560px){.corner-nav{font-size:12px;}.corner-nav a{padding:5px 9px;}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="corner-nav">
    <a href="korea-favorites.html">🏅 한국의 우승후보</a>
    <a href="asia-stars.html">⭐ 주요 아시아 스타 선수</a>
  </nav>
  <header class="hero">
    <span class="eyebrow">2026 Aichi · Nagoya</span>
    <h1>제20회 아이치·나고야<br><em>아시안게임 종목</em> 안내</h1>
    <p class="lede">대분류를 눌러 펼치고, 원하는 항목을 클릭하면 해당 종목 페이지로 이동합니다.</p>
    <div class="stat-row">
      <div class="stat"><b>7</b><span>대분류</span></div>
      <div class="stat"><b id="linkCount">-</b><span>연결 페이지</span></div>
      <div class="stat"><b>2026</b><span>대회 연도</span></div>
    </div>
  </header>

  <section class="featured-section">
    <div class="featured-heading">
      <h2>주목할 만한 종목</h2>
      <span>관심사별로 바로 이동</span>
    </div>
    <div class="featured-grid" id="featuredGrid"></div>
  </section>

  <main class="grid" id="grid"></main>

  <footer>
    <span>구조: 대분류 → 항목(2단계) · 항목 클릭 시 개별 페이지로 이동</span>
    <span>예시: 축구 → soccer.html</span>
  </footer>
</div>

<script>
const FEATURED = [
  { mark:"世", accent:"var(--gold)", eyebrow:"World Class", title:"세계 최고 레벨 종목", note:"한국이 세계 정상급 경쟁력을 갖춘 종목", items:[
    { label:"양궁", slug:"archery" },
    { label:"사격", slug:"shooting" },
    { label:"펜싱", slug:"fencing" },
    { label:"태권도", slug:"taekwondo" },
    { label:"배드민턴", slug:"badminton" },
  ]},
  { mark:"挑", accent:"var(--sun)", eyebrow:"Rising Contender", title:"올림픽 입상을 노리는 도전자", note:"올림픽 메달권 진입을 노리는 종목", items:[
    { label:"유도", slug:"judo" },
    { label:"역도", slug:"weightlifting" },
    { label:"탁구", slug:"tabletennis" },
    { label:"근대5종", slug:"modernpentathlon" },
    { label:"수영", slug:"swimming" },
  ]},
  { mark:"亞", accent:"var(--jade)", eyebrow:"Asia's Best", title:"아시아 최강을 노리는 팀", note:"아시아권 정상을 목표로 하는 단체 종목", items:[
    { label:"축구", slug:"soccer" },
    { label:"야구", slug:"baseball" },
    { label:"골프", slug:"golf" },
    { label:"e스포츠", slug:"esports" },
  ]},
  { mark:"未", accent:"var(--plum)", eyebrow:"Next Wave", title:"미래를 기대하는 종목", note:"성장 가능성이 큰 신흥·유망 종목", items:[
    { label:"클라이밍", slug:"climbing" },
    { label:"스케이트보드", slug:"skateboard" },
    { label:"체조", slug:"gymnastics" },
    { label:"복싱", slug:"boxing" },
  ]},
];

const DATA = [
  { title:"단체구기", note:"여러 명이 한 팀을 이뤄 겨루는 구기 종목", items:[
    { label:"축구", slug:"soccer" },
    { label:"농구 / 3x3농구", slug:"basketball" },
    { label:"야구 / 소프트볼", slug:"baseball" },
    { label:"배구 / 비치발리볼", slug:"volleyball" },
    { label:"핸드볼 / 하키", slug:"handball" },
    { label:"럭비 / 크리켓 / 수구", slug:"rugby" },
  ]},
  { title:"개인구기", note:"라켓·채로 개인 또는 소수가 겨루는 종목", items:[
    { label:"배드민턴", slug:"badminton" },
    { label:"탁구", slug:"tabletennis" },
    { label:"골프", slug:"golf" },
    { label:"테니스", slug:"tennis" },
  ]},
  { title:"무도와 격투기", note:"올림픽 정식 무도·격투 종목", items:[
    { label:"태권도", slug:"taekwondo" },
    { label:"유도", slug:"judo" },
    { label:"레슬링", slug:"wrestling" },
    { label:"복싱", slug:"boxing" },
  ]},
  { title:"올림픽 · 무기·기술종목", note:"도구·정밀 기술을 겨루는 올림픽 종목", items:[
    { label:"양궁", slug:"archery" },
    { label:"펜싱", slug:"fencing" },
    { label:"사격", slug:"shooting" },
    { label:"근대5종", slug:"modernpentathlon" },
  ]},
  { title:"올림픽 · 기초종목", note:"전통적 기초 올림픽 종목", items:[
    { label:"육상", slug:"athletics" },
    { label:"수영류(경영 / 다이빙 / 아티스틱스위밍)", slug:"swimming" },
    { label:"역도", slug:"weightlifting" },
    { label:"기계체조", slug:"gymnastics" },
    { label:"트라이애슬론", slug:"triathlon" },
  ]},
  { title:"올림픽 · 기타종목", note:"최근 올림픽에 편입된 신생·확장 종목", items:[
    { label:"클라이밍", slug:"climbing" },
    { label:"스케이트보드", slug:"skateboard" },
    { label:"사이클", slug:"cycling" },
    { label:"수상", slug:"watersports" },
    { label:"리듬체조 / 트램펄린 / 승마", slug:"rhythmicgymnastics" },
  ]},
  { title:"비올림픽 종목", note:"아시안게임 고유·지역 인기 종목", items:[
    { label:"소프트테니스 / 스쿼시", slug:"softtennis" },
    { label:"지역종목(카바디 / 세팍타크로)", slug:"kabaddi" },
    { label:"투기(가라테 / MMA / 쿠라쉬 / 우슈 / 주짓수)", slug:"karate" },
    { label:"e스포츠(LOL / 배그 / 풋볼 / 기타)", slug:"esports" },
    { label:"브레이킹", slug:"breaking" },
    { label:"테크볼", slug:"teqball" },
  ]},
];

// Featured 2x2 render
const featuredGrid = document.getElementById('featuredGrid');
FEATURED.forEach(f => {
  const card = document.createElement('div');
  card.className = 'fcard';
  card.style.setProperty('--accent', f.accent);
  card.setAttribute('data-mark', f.mark);
  const pills = f.items.map(item =>
    `<a href="${item.slug}.html">${item.label}</a>`
  ).join('');
  card.innerHTML = `
    <p class="fcard-eyebrow">${f.eyebrow}</p>
    <p class="fcard-title">${f.title}</p>
    <p class="fcard-note">${f.note}</p>
    <div class="fpills">${pills}</div>
  `;
  featuredGrid.appendChild(card);
});

// Main accordion render
const grid = document.getElementById('grid');
let totalLinks = 0;

DATA.forEach((cat, idx) => {
  totalLinks += cat.items.length;
  const card = document.createElement('div');
  card.className = 'card';
  const head = document.createElement('button');
  head.className = 'card-head';
  head.setAttribute('aria-expanded', 'false');
  head.innerHTML = `
    <div>
      <span class="card-num">${String(idx+1).padStart(2,'0')}</span>
      <p class="card-title">${cat.title}</p>
      <span class="card-count">${cat.note} · ${cat.items.length}개 항목</span>
    </div>
    <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  `;
  const subwrap = document.createElement('div');
  subwrap.className = 'subwrap';
  const sublist = document.createElement('div');
  sublist.className = 'sublist';
  cat.items.forEach(item => {
    const a = document.createElement('a');
    a.href = `${item.slug}.html`;
    a.innerHTML = `<span class="lbl">${item.label}</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>`;
    sublist.appendChild(a);
  });
  subwrap.appendChild(sublist);
  head.addEventListener('click', () => {
    const isOpen = card.classList.toggle('open');
    head.setAttribute('aria-expanded', String(isOpen));
  });
  card.appendChild(head);
  card.appendChild(subwrap);
  grid.appendChild(card);
});
document.getElementById('linkCount').textContent = totalLinks;
</script>
</body>
</html>
