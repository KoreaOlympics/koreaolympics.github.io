<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>럭비&#183;크리켓&#183;수구 전광판 보드</title><style>:root{--ink:#111827;--line:#d8dee8;--bg:#f7f9fc;--panel:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0f172a 0,#172554 220px,#f7f9fc 221px);font-family:Pretendard,Arial,sans-serif;color:var(--ink)}.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 70px}a{color:#1d4ed8;text-decoration:none}.hero{color:#fff;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}h1{font-size:clamp(28px,5vw,54px);margin:4px 0 8px;line-height:1.05}.hero p{margin:0;color:#dbeafe}.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.score div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:12px}.score b{display:block;font-size:26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}.toolbar a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:start}.board-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 24px rgba(15,23,42,.06)}.event{font-weight:900;font-size:18px;margin-bottom:8px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.meta span{font-size:12px;background:#eef2ff;border:1px solid #dbe4ff;border-radius:999px;padding:4px 8px;color:#1e3a8a}p{margin:0;line-height:1.55;font-size:14px}.note{margin-top:18px;background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:12px;color:#7c2d12}@media(max-width:720px){.score{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><span class="eyebrow">Korea Olympics Board</span><h1>럭비&#183;크리켓&#183;수구 전광판</h1><p>게시판·홍보용 압축 보드. 긴 정보는 상세 페이지로 분리해 유지합니다.</p><div class="score"><div><b>1</b>표시 블록</div><div><b>5</b>요약 행</div><div><b>모바일</b>자동 1열 전환</div></div></section><nav class="toolbar"><a href="rugby.html">종목 상세</a><a href="rugby_player.html">전체 출전자 명단</a></nav><section class="grid"><article class="board-card"><div class="event">전체 출전자 명단</div><div class="meta"><span>5명/행</span><span>관련 문서, 럭비, 수구, 영문명, 크리켓</span></div><p>한국 출전자 없음/미확인</p></article></section><div class="note">단체구기 보드는 선수명단을 제외하고 일정·조편성·전적 중심으로 운영합니다. 개인종목은 세부종목별 한국 선수와 참가 규모를 앞에 배치합니다.</div></main></body></html>
