<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>축구 - 2026 아이치·나고야 아시안게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#f8f9fa; --border:#c8ccd1; --border-soft:#eaecf0;
    --ink:#202122; --muted:#54595d; --link:#3366cc;
    --serif:'Noto Serif KR',Georgia,'Times New Roman',serif;
    --sans:'Pretendard','Helvetica Neue',Arial,sans-serif;
    --sun:#ba0000; --gold:#a05a00;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;}
  a{color:var(--link);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .topbar{border-bottom:1px solid var(--border);background:var(--panel);font-size:12.5px;color:var(--muted);}
  .topbar .inner{max-width:820px;margin:0 auto;padding:8px 20px;display:flex;gap:16px;flex-wrap:wrap;}
  .topbar a{color:var(--link);}
  .wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px;}
  h1.title{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.3;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .subtitle{color:var(--muted);font-size:13px;margin:0 0 24px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .gate{border:1px solid var(--border);border-radius:2px;background:var(--panel);padding:24px 22px;text-decoration:none;color:var(--ink);display:block;transition:box-shadow .15s,border-color .15s;}
  .gate:hover{border-color:var(--accent,var(--link));box-shadow:0 3px 12px rgba(0,0,0,.06);text-decoration:none;}
  .gate-title{font-family:var(--serif);font-weight:700;font-size:21px;margin:0 0 8px;color:var(--ink);}
  .gate-note{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 10px;}
  .gate-go{font-size:13px;font-weight:600;color:var(--accent,var(--link));}
  @media (max-width:560px){.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="topbar"><div class="inner">
  <a href="index2.html">← 아시안게임 종목 목록</a>
  <span>문서 · 축구</span>
  <a href="index.html">전체 목차</a>
</div></div>
<div class="wrap">
  <h1 class="title">축구</h1>
  <p class="subtitle">Football · 2026 아이치·나고야 아시안게임 (제20회) — 남자 U23축구와 여자축구는 별도 페이지로 정리되어 있습니다.</p>
  <div class="cards">
    <a class="gate" href="soccer_men.html" style="--accent:#2456c6">
      <p class="gate-title">⚽ 남자 U23축구</p>
      <p class="gate-note">참가 15개국, 대한민국은 D조(사우디아라비아·카타르)에 편성.</p>
      <span class="gate-go">바로가기 →</span>
    </a>
    <a class="gate" href="soccer_women.html" style="--accent:var(--sun)">
      <p class="gate-title">⚽ 여자축구</p>
      <p class="gate-note">참가 12개국, 대한민국은 B조(북한·방글라데시·미얀마)에 편성.</p>
      <span class="gate-go">바로가기 →</span>
    </a>
  </div>
</div>
</body>
</html>
